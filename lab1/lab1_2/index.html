<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик ворон</title>
</head>
<body>
    <div class="counter_cont">
        <div class="header">
            <h2>Считаем ворон</h2>
        </div>

        <div class="container">
            <form id="crows">
                <div class="input">
                    <input type="number" placeholder="Введите число" min="1">
                </div>
                <button type="submit" class="count">Считать</button>
                <div class="result_area">
                    <label>Наши вороны:</label>
                    <textarea id="resultTextArea" rows="4"></textarea>
                </div>
            </form>
        </div>
        <footer>кар-кар</footer>
    </div>
</body>
</html>
